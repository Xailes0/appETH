<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ETH Map App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
}

body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* PHONE */
.phone {
  width: 390px;
  height: 844px;
  border-radius: 32px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  position: relative;
  color: #fff;
}

/* SCREENS */
.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: flex;
}

/* ---------- LOGIN ---------- */
#login {
  background: radial-gradient(circle at top, #1f2937, #020617);
  flex-direction: column;
  justify-content: center;
  padding: 28px;
  gap: 16px;
}

#login h1 {
  font-size: 28px;
  text-align: center;
}

#login p {
  font-size: 14px;
  opacity: 0.7;
  text-align: center;
}

.input {
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #020617;
  color: #fff;
}

.button {
  padding: 12px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

/* ---------- SECTION ---------- */
#section {
  background: #020617;
  flex-direction: column;
  padding: 24px;
}

#section h2 {
  font-size: 22px;
  margin-bottom: 8px;
}

#section p {
  font-size: 14px;
  opacity: 0.6;
  margin-bottom: 16px;
}

.section-btn {
  padding: 14px;
  border-radius: 14px;
  background: #020617;
  border: 1px solid #374151;
  color: #fff;
  text-align: left;
  cursor: pointer;
  margin-bottom: 10px;
}

.section-btn:hover {
  background: #2563eb;
}

/* ---------- MAP ---------- */
#map-screen {
  background: #000;
}

/* Map container */
.map-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.map {
  width: 100%;
  height: 100%;
  background-image: url("newmage.png");
  background-size: cover;
  background-position: center;
  transform: translate(0,0) scale(1);
  cursor: grab;
}

.map:active {
  cursor: grabbing;
}

/* UI overlay */
.ui {
  position: relative;
  inset: 0;
  padding: 16px;
  pointer-events: none;
}

/* Zoom buttons */
.zoom {
  position: absolute;
  left: 16px;
  top: 160px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: auto;
}

.zoom button {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
}

/* Leaderboard */
.leaderboard {
  position: absolute;
  top: 90px;
  right: 12px;
  width: 160px;
  background: rgba(0,0,0,0.75);
  border-radius: 14px;
  padding: 10px;
  font-size: 12px;
  pointer-events: auto;
}

.leaderboard h3 {
  font-size: 13px;
  margin-bottom: 6px;
}

.lb-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
</style>
</head>

<body>
<div class="phone">

<!-- LOGIN -->
<div id="login" class="screen active">
  <h1>Welcome</h1>
  <p>Sign in to access ETH Campus Map</p>
  <input class="input" placeholder="Email">
  <input class="input" type="password" placeholder="Password">
  <button class="button" onclick="goSection()">Login</button>
</div>

<!-- SECTION -->
<div id="section" class="screen">
  <h2>Choose your department</h2>
  <p>This will customize your campus experience</p>

  <button class="section-btn" onclick="goMap()">Mechanical Engineering</button>
  <button class="section-btn" onclick="goMap()">Computer Science</button>
  <button class="section-btn" onclick="goMap()">Mathematics</button>
  <button class="section-btn" onclick="goMap()">Physics</button>
  <button class="section-btn" onclick="goMap()">Electrical Engineering</button>
</div>

<!-- MAP -->
<div id="map-screen" class="screen">
  <div class="map-container">
    <div id="map" class="map"></div>
  </div>

  <div class="ui">
    <!-- Zoom -->
    <div class="zoom">
      <button onclick="zoomIn()">+</button>
      <button onclick="zoomOut()">−</button>
    </div>

    <!-- Leaderboard -->
    <div class="leaderboard">
      <h3>Leaderboard</h3>
      <div class="lb-item"><span>Computer Science</span><span>120</span></div>
      <div class="lb-item"><span>Mechanical Eng.</span><span>98</span></div>
      <div class="lb-item"><span>Physics</span><span>87</span></div>
      <div class="lb-item"><span>Mathematics</span><span>80</span></div>
    </div>
  </div>
</div>

</div>

<script>
/* Navigation */
function goSection() {
  document.getElementById("login").classList.remove("active");
  document.getElementById("section").classList.add("active");
}

function goMap() {
  document.getElementById("section").classList.remove("active");
  document.getElementById("map-screen").classList.add("active");
}

/* Map pan & zoom */
let scale = 1;
let x = 0;
let y = 0;
let drag = false;
let startX, startY;
const map = document.getElementById("map");

map.addEventListener("mousedown", e => {
  drag = true;
  startX = e.clientX - x;
  startY = e.clientY - y;
});

window.addEventListener("mouseup", () => drag = false);

window.addEventListener("mousemove", e => {
  if (!drag) return;
  x = e.clientX - startX;
  y = e.clientY - startY;
  updateMap();
});

function zoomIn() {
  scale = Math.min(scale + 0.2, 3);
  updateMap();
}

function zoomOut() {
  scale = Math.max(scale - 0.2, 1);
  updateMap();
}

function updateMap() {
  map.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}
</script>
</body>
</html>
